<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Special Character</title>
  </head>
  <body>
    <!--Special Character-->
    <!-- Escape character 
    yang artinya tidak menulis karakter itu sendiri, tetapi di ganti denan
    nilai numeric atau karakter referensi pada karakter nya
    -->

    <!-- ada dua cara melakukan nya
     1. numeric entity (nilai numerik)
     2. named entity (nama singkatan) -->

    <!--Example-->
    <p>Belajar Dasar Pemrograman Web &copy; 2023, Dicoding</p>
    <p>Belajar Dasar Pemrograman Web &#169; 2023, Dicoding</p>
    <p>Belajar Dasar Pemrograman Web &amp; 2023, Dicoding</p>
  </body>
</html>
