<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Semantic HTML</title>
  </head>
  <body>
    <article>
      <header>
        <h1>Judul Artikel</h1>
        <h2>Oleh: Dicoding Indonesia</h2>
      </header>
      <p>
        <!--Konten Artikel dimulai dari sini-->
      </p>
      <footer>
        <p>Bagikan artikel ini melalui</p>
        <ul>
          <li>Twitter</li>
          <li>Facebook</li>
        </ul>

    <!---->

    <!--Elemen Main-->

      <header>
        <!--Konten header website-->
      </header>
      <main>
        <!--Konten utama website-->
      </main>
      <footer>
        <!--Konten footer website-->
      </footer>
    </body>
  </body>
</html>
