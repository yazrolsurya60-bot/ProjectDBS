<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Elemen HTML</title>
  </head>
  <body>
    Ini adalah teks tanpa elemen paragraf
    <p class="contoh contoh1 contoh2">Contoh elemen paragraf</p>
    <p contenteditable="true">Ini adalah teks dengan elemen paragraf</p>
    <p data-tes="123">coba atribut data-*</p>
    <p dir="rtl">coba atribut dir</p>
    <p draggable="true">coba atribut draggable</p>
    <p dropzone="move">coba atribut dropzone</p>
    <p>coba atribut hidden</p>
  </body>
</html>
