<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Halaman Latihan</title>
  </head>
  <body>
    <h1>Latihan Paragraph</h1>
    Ini adalah teks tanpa elemen paragraph

    <p>Ini adalah teks dengan elemen paragraph</p>

    <p>
      <strong>HTML</strong> merupakan <i>markup language</i> untuk membangun
      halaman web
    </p>

    <h1>Atribut dalam HTML</h1>
    <img src="assets/image/history.jpg" />

    <p class="example">ini adalah teks dalam elemen paragraf</p>

    <!-- Latihan accesskey -->
    <a href="https://google.com" accesskey="g">Buka Google</a>

    <!-- Latihan class -->
    <p class="teks-merah tebal">Ini adalah peringatan!</p>
  </body>
</html>
