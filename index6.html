<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input User</title>
  </head>
  <body>
    <!--Elemen Input-->
    <!--merupakan elemen yang menerima masukan dari user-->
    <div>
      Text:
      <input type="text" pattern="[a-z]{2}" />
    </div>
    <div>
      Number:
      <input type="number" min="1" max="10" />
    </div>
    <div>
      Email:
      <input type="email" />
    </div>
    <div>
      Password:
      <input type="password" />
    </div>
    <div>
      Search
      <input type="search" />
    </div>
    <div>
      Date
      <input type="date" />
    </div>
    <div>
      Time
      <input type="time" />
    </div>
    <div>
      DateTime
      <input type="datetime-local" />
    </div>
    <div>
      Checkbox
      <input type="checkbox" value="Sakit" checked /> Sakit <br />
      Checkbox
      <input type="checkbox" /> <br />
      Checkbox
      <input type="checkbox" />
    </div>
    <div>
      Radio
      <input type="radio" />
    </div>
    <div>
      Range
      <input type="range" />
    </div>
    <div>
      Color
      <input type="color" />
    </div>
    <div>
      File
      <input type="file" multiple />
    </div>
    <div>
      Submit
      <input type="submit" />
    </div>
    <div>
      Hidden
      <input type="hidden" />
    </div>

    <!--Elemen Non-Single Line Input-->
    <input type="text" value="Belajar Dasar Pemrograman Web" />
    <br />
    <textarea rows="6" cols="16">
        Belajar Dasar
        Pemrograman Web
    </textarea>

    <div>
      <label for="email">Email</label> <br />
      <input type="email" id="email" />
    </div>

    <div>
      <label for="password">Password</label> <br />
      <input type="password" id="password" />
    </div>

    <!--Aribut Elemen Input-->

    <!--Atribut Placeholder & Required-->
    <div>
      <label for="email">Email</label>
      <br />
      <input type="email" readonly id="email" placeholder="example@gmail.com" />

      <div>
        <label for="password">Password</label> <br />
        <input type="password" id="password" placeholder="******" required />
      </div>
    </div>

    <form>
      <div>
        <label for="email">Email</label>
        <br />
        <input type="email" id="email" />
      </div>

      <div>
        <label for="password">Password</label>
        <br />
        <input type="password" id="password" />
      </div>

      <button type="submit">submit</button>
    </form>

    <!--atribut action-->
    <form action=".env.example">
      <div>
        <label for="fullName">Nama</label>
        <input type="text" name="fullName" id="fullName" required />
      </div>

      <div>
        <label for="checkIn">Tanggal Check-In</label>
        <input type="date" name="checkIn" id="checkIn" required />
      </div>

      <div>
        <label for="chekcOut">Tanggal Check-Out</label>
        <input type="date" name="checkOut" id="chekcOut" required />
      </div>

      <button type="submit">Submit</button>
    </form>

    <!--atribut method-->
    <!--metode GET-->
    <form method="GET" action="https://example.com/">
      <div>
        <label for="fullName">Nama</label>
        <input type="text" name="fullName" id="fullName" required />
      </div>

      <div>
        <label for="checkIn">Tanggal Check-In</label>
        <input type="date" name="checkIn" id="checkIn" required />
      </div>

      <div>
        <label for="chekcOut">Tanggal Check-Out</label>
        <input type="date" name="checkOut" id="chekcOut" required />
      </div>

      <button type="submit">Submit</button>
    </form>

    <!--metode POST-->
    <form method="POST" action="https://example.com/">
      <div>
        <label for="fullName">Nama</label>
        <input type="text" name="fullName" id="fullName" required />
      </div>

      <div>
        <label for="checkIn">Tanggal Check-In</label>
        <input type="date" name="checkIn" id="checkIn" required />
      </div>

      <div>
        <label for="chekcOut">Tanggal Check-Out</label>
        <input type="date" name="checkOut" id="chekcOut" required />
      </div>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
