<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input User</title>
  </head>
  <body>
    <!--Elemen Input-->
    <!--merupakan elemen yang menerima masukan dari user-->
    <div>
      Text:
      <input type="text" />
    </div>
    <div>
      Number:
      <input type="number" />
    </div>
    <div>
      Email:
      <input type="email" />
    </div>
    <div>
      Password:
      <input type="password" />
    </div>
    <div>
      Search
      <input type="search" />
    </div>
    <div>
      Date
      <input type="date" />
    </div>
    <div>
      Time
      <input type="time" />
    </div>
    <div>
      DateTime
      <input type="datetime-local" />
    </div>
    <div>
      Checkbox
      <input type="checkbox" /> <br />
      Checkbox
      <input type="checkbox" /> <br />
      Checkbox
      <input type="checkbox" />
    </div>
    <div>
      Radio
      <input type="radio" />
    </div>
    <div>
      Range
      <input type="range" />
    </div>
    <div>
      Color
      <input type="color" />
    </div>
    <div>
      File
      <input type="file" />
    </div>
    <div>
      Submit
      <input type="submit" />
    </div>
    <div>
      Hidden
      <input type="hidden" />
    </div>

    <!--Elemen Non-Single Line Input-->
    <input type="text" value="Belajar Dasar Pemrograman Web" />
    <br />
    <textarea rows="6" cols="16">
        Belajar Dasar
        Pemrograman Web
    </textarea>
  </body>
</html>
